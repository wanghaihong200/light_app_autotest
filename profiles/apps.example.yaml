# 产品线 profile：App × 环境（设备是运行时事实，不写在这里）
# 复制为 apps.yaml 并填入真实信息；命令行 --laf-app mall --laf-env test 选用。
defaults:
  appium_server: http://127.0.0.1:4723
  timeout: 10            # 候选链默认超时（秒）
  poll_interval: 0.5
  artifacts_dir: artifacts
  node_bin: node         # sidecar 用的 node 可执行文件

apps:
  # 混合 App 示例
  mall:
    kind: app
    android:
      package: com.example.mall
      activity: .MainActivity   # 留空则由 Appium 自动解析启动页
      # apk: dist/mall-test.apk  # 提供则每次安装 apk
    envs:
      test:
        api_base: https://test.example.com
      prod:
        api_base: https://www.example.com

  # 微信小程序示例
  mall_mp:
    kind: miniprogram
    miniprogram:
      project_path: D:/workspace/mall-miniprogram   # 含 project.config.json 的目录
      devtools_cli: "C:/Program Files (x86)/Tencent/微信web开发者工具/cli.bat"
      appid: wx1234567890abcdef   # 建议用测试号
      ws_endpoint: ""             # 真机调试 2.0 的 wsEndpoint，仅手工探索用，不进 CI
    envs:
      test:
        api_base: https://test.example.com
